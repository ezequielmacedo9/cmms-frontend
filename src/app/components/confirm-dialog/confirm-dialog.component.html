<div class="confirm-backdrop" (click)="onBackdrop()" aria-hidden="true"></div>

<div class="confirm-dialog"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="confirm-title"
     [attr.aria-describedby]="message ? 'confirm-message' : null"
     [class.confirm-dialog--danger]="variant === 'danger'"
     [class.confirm-dialog--warning]="variant === 'warning'"
     [class.confirm-dialog--info]="variant === 'info'"
     (click)="$event.stopPropagation()">

  <div class="confirm-icon" aria-hidden="true">
    <mat-icon>{{ iconName }}</mat-icon>
  </div>

  <h2 id="confirm-title" class="confirm-title">{{ title | t }}</h2>

  @if (message) {
    <p id="confirm-message" class="confirm-message">{{ message | t }}</p>
  }

  <div class="confirm-actions">
    <button type="button" class="ui-btn ui-btn--secondary" (click)="cancelled.emit()">
      {{ cancelLabel | t }}
    </button>
    <button #confirmBtn
            type="button"
            class="ui-btn"
            [class.ui-btn--primary]="variant !== 'danger'"
            [class.ui-btn--danger]="variant === 'danger'"
            (click)="confirmed.emit()">
      {{ confirmLabel | t }}
    </button>
  </div>
</div>
