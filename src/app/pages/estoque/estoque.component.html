<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <button mat-icon-button (click)="voltar()" class="back-btn">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2>Estoque de Peças</h2>
    </div>
    <button mat-raised-button color="primary" (click)="novoRegistro()">
      <mat-icon>add</mat-icon>
      Nova Peça
    </button>
  </div>

  <mat-card *ngIf="showForm" class="form-card">
    <h2>{{ editando ? 'Editar Peça' : 'Nova Peça' }}</h2>
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput [(ngModel)]="form.codigo" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput [(ngModel)]="form.nome" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Quantidade em Estoque</mat-label>
      <input matInput type="number" [(ngModel)]="form.quantidadeEmEstoque" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Custo Unitário</mat-label>
      <input matInput type="number" [(ngModel)]="form.custoUnitario" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Vida Útil (horas)</mat-label>
      <input matInput type="number" [(ngModel)]="form.vidaUtilHoras" />
    </mat-form-field>
    <div class="form-actions">
      <button mat-raised-button color="primary" (click)="salvar()" [disabled]="salvando">
        <span *ngIf="!salvando">Salvar</span>
        <span *ngIf="salvando">Salvando...</span>
      </button>
      <button mat-button (click)="cancelar()" [disabled]="salvando">Cancelar</button>
    </div>
  </mat-card>

  <table mat-table [dataSource]="pecas" class="mat-elevation-z2">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let p">{{ p.codigo }}</td>
    </ng-container>
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
    </ng-container>
    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef>Quantidade</th>
      <td mat-cell *matCellDef="let p">{{ p.quantidadeEmEstoque }}</td>
    </ng-container>
    <ng-container matColumnDef="custo">
      <th mat-header-cell *matHeaderCellDef>Custo</th>
      <td mat-cell *matCellDef="let p">{{ p.custoUnitario }}</td>
    </ng-container>
    <ng-container matColumnDef="vidaUtil">
      <th mat-header-cell *matHeaderCellDef>Vida Útil (h)</th>
      <td mat-cell *matCellDef="let p">{{ p.vidaUtilHoras }}</td>
    </ng-container>
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button color="primary" (click)="editar(p)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deletar(p.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
