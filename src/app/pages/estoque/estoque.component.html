<div class="estoque-container">
  <div class="header">
    <h1>Estoque de Peças</h1>
    <button mat-raised-button color="primary" (click)="showForm = !showForm">
      + Nova Peça
    </button>
  </div>

  <div class="form-card" *ngIf="showForm">
    <h2>{{ editando ? 'Editar Peça' : 'Nova Peça' }}</h2>
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput [(ngModel)]="novaPeca.nome" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Quantidade</mat-label>
      <input matInput type="number" [(ngModel)]="novaPeca.quantidade" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Unidade</mat-label>
      <input matInput [(ngModel)]="novaPeca.unidade" />
    </mat-form-field>
    <div class="form-actions">
      <button mat-raised-button color="primary" (click)="salvar()">Salvar</button>
      <button mat-button (click)="cancelar()">Cancelar</button>
    </div>
  </div>

  <table mat-table [dataSource]="pecas" class="mat-elevation-z2">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
    </ng-container>
    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef>Quantidade</th>
      <td mat-cell *matCellDef="let p">{{ p.quantidade }}</td>
    </ng-container>
    <ng-container matColumnDef="unidade">
      <th mat-header-cell *matHeaderCellDef>Unidade</th>
      <td mat-cell *matCellDef="let p">{{ p.unidade }}</td>
    </ng-container>
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button (click)="editar(p)">✏️</button>
        <button mat-icon-button (click)="deletar(p.id)">🗑️</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
  </table>
</div>
