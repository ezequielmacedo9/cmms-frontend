<div class="auth-page">
  <div class="card">
    <div class="logo">CMMS</div>
    @if (!sent) {
      <h2>Esqueceu sua senha?</h2>
      <p class="sub">Informe seu email e enviaremos um link para redefinição.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="seu@email.com" (keyup.enter)="submit()" />
      </div>
      @if (error) { <div class="error">{{ error }}</div> }
      <button class="btn-primary" (click)="submit()" [disabled]="loading || !email">
        @if (loading) { <div class="spinner-sm"></div> }
        {{ loading ? 'Enviando...' : 'Enviar link' }}
      </button>
    } @else {
      <div class="success-icon">✉️</div>
      <h2>Email enviado!</h2>
      <p class="sub">Se o email <strong>{{ email }}</strong> estiver cadastrado, você receberá as instruções em breve.</p>
      <p class="sub small">Verifique também a caixa de spam.</p>
    }
    <button class="btn-text" (click)="goLogin()">← Voltar ao login</button>
  </div>
</div>
