<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CMMS Industrial Suite</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma enterprise de gestão de manutenção industrial: máquinas, manutenções preventivas e corretivas, estoque de peças e relatórios.">
  <meta name="keywords" content="CMMS, manutenção industrial, gestão de ativos, manutenção preventiva, sistema CMMS, indústria 4.0">
  <meta name="author" content="CMMS Industrial Suite">
  <meta name="theme-color" content="#7c3aed">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CMMS">

  <!--
    Open Graph + Twitter Card defaults. SeoService keeps them in sync with
    the active route. We also keep them here so static crawlers (bots that
    don't run JS) still see something meaningful.
  -->
  <meta property="og:title" content="CMMS Industrial Suite">
  <meta property="og:description" content="Plataforma enterprise de gestão de manutenção industrial.">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CMMS Industrial Suite">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CMMS Industrial Suite">
  <meta name="twitter:description" content="Plataforma enterprise de gestão de manutenção industrial.">
  <meta name="twitter:image" content="/icons/icon-512.png">

  <!--
    Defence-in-depth CSP via meta tag. The canonical CSP is served by Vercel
    as a response header (vercel.json) and supersedes this one; we keep this
    fallback for environments that bypass the Vercel edge (preview, custom
    hosts, local file:// previews).
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.onrender.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">

  <link rel="preconnect" href="https://cmms-backend-8y7h.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://cmms-backend-8y7h.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    External fonts and Google Sign-In script. Subresource Integrity (SRI) is
    NOT used here because all three URLs serve mutable content whose hash
    changes between deploys (Google rotates the GSI client; the CSS endpoint
    returns user-agent-specific bundles). We mitigate with:
      - Strict CSP (script-src / style-src whitelisted hosts above).
      - referrerpolicy="no-referrer" on the GSI script so origin / path
        of the host page is not leaked.
      - crossorigin="anonymous" so credentials are not sent with the request.
  -->
  <!--
    Fonts são carregadas async ("print" trick): o browser nao bloqueia
    a renderizacao no link, mas o onload promove para 'all' e aplica
    quando estiverem prontas. Fallback <noscript> garante para crawlers.
  -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        crossorigin="anonymous"
        media="print"
        onload="this.media='all'">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap"
        crossorigin="anonymous"
        media="print"
        onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" crossorigin="anonymous">
  </noscript>
  <script src="https://accounts.google.com/gsi/client" async defer crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!--
    JSON-LD structured data — ajuda crawlers (Google, LinkedIn,
    WhatsApp preview cards) a entender o tipo de aplicacao.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "CMMS Industrial Suite",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Plataforma enterprise de gestão de manutenção industrial: máquinas, manutenções preventivas/corretivas, estoque de peças e relatórios.",
    "inLanguage": "pt-BR"
  }
  </script>

  <style>
    /* Inline critical bootstrap loader — visivel antes do bundle JS
       carregar e antes do app montar. Sem isso o usuario ve tela em
       branco por 200-800ms (especialmente em mobile / 3G). */
    .boot-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: #0a0a14;
      color: #fafafa;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      z-index: 0;
    }
    .boot-loader__spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(139, 92, 246, 0.18);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: boot-spin 720ms linear infinite;
    }
    .boot-loader__brand {
      font-size: 13px; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      font-weight: 600;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    /* Once Angular mounts <app-root>, the loader is naturally
       overlaid by the app DOM. */
  </style>
</head>
<body>
  <app-root>
    <div class="boot-loader" role="status" aria-label="Carregando aplicação">
      <div class="boot-loader__spinner" aria-hidden="true"></div>
      <div class="boot-loader__brand">CMMS · Industrial Suite</div>
    </div>
  </app-root>
  <noscript>
    <div style="padding:24px;text-align:center;font-family:sans-serif;color:#fff;background:#0a0a14;">
      Esta aplicação exige JavaScript habilitado para funcionar.
    </div>
  </noscript>
</body>
</html>
